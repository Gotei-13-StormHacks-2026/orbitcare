[project]
name = "orbitcare"
version = "0.1.0"
description = "Satellite data, translated into health advice — StormHacks 2026"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.32",
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.18",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
